spring:
  application:
   name: demo-shell
  shell:
    command:
      script:
        enabled: true
      clear:
        enabled: true
    interactive:
      enabled: true
    help:
      enabled: true
  main:
    banner-mode: "off"
logging:
  level:
    root: WARN
    org.springframework: ERROR
    org.springframework.boot: ERROR
    org.springframework.shell: INFO
    org.jline: ERROR